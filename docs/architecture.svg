<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradPython" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5d84;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradONNX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradJava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED8B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b86c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPanama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#71368A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCpp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00599C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004070;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExchange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8449;stop-opacity:1" />
    </linearGradient>
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" rx="10" />

  <!-- Nodes -->
  <!-- Python Training -->
  <rect x="50" y="50" width="160" height="50" rx="5" fill="url(#gradPython)" />
  <text x="130" y="80" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">1. Python D3QN (PyTorch)</text>

  <!-- ONNX Export -->
  <rect x="50" y="150" width="160" height="50" rx="5" fill="url(#gradONNX)" />
  <text x="130" y="180" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">2. ONNX Model Export</text>

  <!-- Java DJL Orchestrator -->
  <rect x="300" y="100" width="180" height="50" rx="5" fill="url(#gradJava)" />
  <text x="390" y="130" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">3. Java 22 + DJL Engine</text>

  <!-- Panama FFM -->
  <rect x="300" y="200" width="180" height="40" rx="20" fill="url(#gradPanama)" />
  <text x="390" y="225" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">4. Panama FFM (Zero-Copy)</text>

  <!-- C++ Execution Core -->
  <rect x="560" y="150" width="160" height="50" rx="5" fill="url(#gradCpp)" />
  <text x="640" y="180" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">5. C++ Execution Core</text>

  <!-- Exchange Adapter -->
  <rect x="560" y="50" width="160" height="50" rx="5" fill="url(#gradExchange)" />
  <text x="640" y="80" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">6. Exchange Connectivity</text>

  <!-- Edges -->
  <line x1="130" y1="100" x2="130" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <path d="M 210 175 Q 390 175 390 160" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <line x1="390" y1="150" x2="390" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="390" y1="200" x2="390" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <path d="M 480 220 L 640 220 L 640 210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 620 200 L 620 230 L 390 230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <line x1="640" y1="150" x2="640" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="100" x2="640" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Labels -->
  <text x="140" y="125" font-family="Arial" font-size="12" fill="#555">Offline Training</text>
  <text x="240" y="165" font-family="Arial" font-size="12" fill="#555">Load into Memory</text>
  <text x="400" y="185" font-family="Arial" font-size="12" fill="#555">Arena.ofShared()</text>
  <text x="500" y="215" font-family="Arial" font-size="12" fill="#555">Memory Segments</text>
  <text x="650" y="130" font-family="Arial" font-size="12" fill="#555">TCP / DPDK</text>
</svg>
